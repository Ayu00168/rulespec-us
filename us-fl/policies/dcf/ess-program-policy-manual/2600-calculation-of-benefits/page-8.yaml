format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-fl/manual/dcf/ess-program-policy-manual/2600-calculation-of-benefits/page-8
    source_sha256: a0b4fac87f905e6a6989b505b866f5f0306fe361531801c4226d9184e62723e5
  summary: |-
    Assistance groups must meet the gross income standards to be eligible for food stamps with the following exceptions:
    1. assistance groups that contain an elderly or disabled member and are not categorically eligible must meet the net income limits; and 2. standard filing units (SFUs) that are broad-based categorically eligible must meet the 200% gross income limits.
    A spouse or children under 18 who live with this individual may not be separate from the disabled individual.
    When applying the 165% limit test, the income of the elderly or disabled person and their spouse is excluded from this determination.
inputs:
  - name: allowable_gross_income_limit
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    description: Appendix A-1 Monthly 130% Gross Income Limit for the assistance-group size.
  - name: allowable_net_income_limit
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    description: Appendix A-1 Monthly 100% Net Income Limit for the assistance-group size.
  - name: monthly_200_percent_gross_income_limit
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    description: Published Appendix A-1 Monthly 200% Gross Income Limit for the assistance-group size.
  - name: assistance_group_contains_elderly_or_disabled_member
    entity: Household
    dtype: Boolean
    period: Month
  - name: assistance_group_is_categorically_eligible
    entity: Household
    dtype: Boolean
    period: Month
  - name: standard_filing_unit_is_broad_based_categorically_eligible
    entity: Household
    dtype: Boolean
    period: Month
  - name: gross_monthly_income
    entity: Household
    dtype: Money
    period: Month
    unit: USD
  - name: net_monthly_income
    entity: Household
    dtype: Money
    period: Month
    unit: USD
  - name: person_age
    entity: Person
    dtype: Count
    period: Month
  - name: child_age
    entity: Person
    dtype: Count
    period: Month
  - name: child_lives_with_disabled_individual
    entity: Person
    dtype: Boolean
    period: Month
  - name: otherwise_eligible_assistance_group_member
    entity: Person
    dtype: Boolean
    period: Month
  - name: person_has_permanent_disability_under_social_security_act
    entity: Person
    dtype: Boolean
    period: Month
  - name: person_has_non_disease_related_permanent_disability
    entity: Person
    dtype: Boolean
    period: Month
  - name: person_unable_to_purchase_and_prepare_meals
    entity: Person
    dtype: Boolean
    period: Month
    description: Inability caused by the qualifying permanent disability.
  - name: spouse_and_children_under_age_limit_living_with_individual_are_included_with_individual
    entity: Person
    dtype: Boolean
    period: Month
  - name: income_of_others_excluding_individual_and_spouse
    entity: Person
    dtype: Money
    period: Month
    unit: USD
  - name: monthly_165_percent_need_standard_for_others
    entity: Person
    dtype: Money
    period: Month
    unit: USD
    description: Published Appendix A-1 165% Need Standards amount for the applicable number of others; excludes the individual and spouse.
rules:
  - name: separate_assistance_group_minimum_age
    kind: parameter
    dtype: Count
    source: Florida ESS 2610.0104.02
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-fl/manual/dcf/ess-program-policy-manual/2600-calculation-of-benefits/page-8
              excerpt: "60 or older"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          60
  - name: children_required_with_disabled_individual_age_limit
    kind: parameter
    dtype: Count
    source: Florida ESS 2610.0104.02
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-fl/manual/dcf/ess-program-policy-manual/2600-calculation-of-benefits/page-8
              excerpt: "children under 18"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          18
  - name: need_standard_income_limit_rate
    kind: parameter
    dtype: Rate
    source: Florida ESS 2610.0104.02
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-fl/manual/dcf/ess-program-policy-manual/2600-calculation-of-benefits/page-8
              excerpt: "165% of the gross eligibility standard"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          1.65
  - name: broad_based_categorical_gross_income_limit_rate
    kind: parameter
    dtype: Rate
    source: Florida ESS 2610.0103
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-fl/manual/dcf/ess-program-policy-manual/2600-calculation-of-benefits/page-8
              excerpt: "200% gross income limits"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          2.00
  - name: person_meets_age_requirement_for_elderly_disabled_separate_group
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Florida ESS 2610.0104.02
    metadata: &person_proof
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-fl/manual/dcf/ess-program-policy-manual/2600-calculation-of-benefits/page-8
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          person_age >= separate_assistance_group_minimum_age
  - name: child_under_age_limit_may_not_be_separate_from_disabled_individual
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Florida ESS 2610.0104.02
    metadata: *person_proof
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          child_age < children_required_with_disabled_individual_age_limit
          and child_lives_with_disabled_individual
  - name: income_of_others_within_165_percent_need_standard
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Florida ESS 2610.0104.02; Appendix A-1 165% Need Standard Table
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-fl/manual/dcf/ess-program-policy-manual/2600-calculation-of-benefits/page-8
              excerpt: "does not exceed 165%"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          income_of_others_excluding_individual_and_spouse <= monthly_165_percent_need_standard_for_others
  - name: elderly_disabled_individual_may_be_separate_assistance_group
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Florida ESS 2610.0104.02
    metadata: *person_proof
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          otherwise_eligible_assistance_group_member
          and person_meets_age_requirement_for_elderly_disabled_separate_group
          and person_unable_to_purchase_and_prepare_meals
          and (person_has_permanent_disability_under_social_security_act or person_has_non_disease_related_permanent_disability)
          and spouse_and_children_under_age_limit_living_with_individual_are_included_with_individual
          and income_of_others_within_165_percent_need_standard
  - name: assistance_group_must_meet_net_income_limit
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Florida ESS 2610.0103 exception 1
    metadata: *person_proof
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          assistance_group_contains_elderly_or_disabled_member
          and not assistance_group_is_categorically_eligible
  - name: assistance_group_must_meet_gross_income_standard
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Florida ESS 2610.0103
    metadata: *person_proof
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          not assistance_group_must_meet_net_income_limit
          and not standard_filing_unit_is_broad_based_categorically_eligible
  - name: broad_based_categorical_gross_income_limit
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: Florida ESS 2610.0103 exception 2; Appendix A-1 gross income limits
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-fl/manual/dcf/ess-program-policy-manual/2600-calculation-of-benefits/page-8
              excerpt: "200% gross income limits"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          monthly_200_percent_gross_income_limit
  - name: standard_filing_unit_satisfies_200_percent_gross_income_test
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Florida ESS 2610.0103 exception 2
    metadata: *person_proof
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          gross_monthly_income <= broad_based_categorical_gross_income_limit
  - name: assistance_group_satisfies_gross_income_test
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Florida ESS 2610.0104.03
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-fl/manual/dcf/ess-program-policy-manual/2600-calculation-of-benefits/page-8
              excerpt: "equal to or exceeds the gross income limit"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          gross_monthly_income < allowable_gross_income_limit
  - name: assistance_group_satisfies_net_income_limit
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Florida ESS 2610.0103 exception 1
    metadata: *person_proof
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          net_monthly_income <= allowable_net_income_limit
  - name: assistance_group_income_test_satisfied_for_food_stamps
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Florida ESS 2610.0103 and 2610.0104.03
    metadata: *person_proof
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          (not assistance_group_must_meet_net_income_limit or assistance_group_satisfies_net_income_limit)
          and (not assistance_group_must_meet_gross_income_standard or assistance_group_satisfies_gross_income_test)
          and (not standard_filing_unit_is_broad_based_categorically_eligible or standard_filing_unit_satisfies_200_percent_gross_income_test)
